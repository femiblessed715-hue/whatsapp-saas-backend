<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-24 text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-10 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 id="store-name" class="text-xl font-bold text-gray-900">Loading Store...</h1>
      <span id="cart-badge" class="bg-green-600 text-white text-xs font-bold px-2.5 py-1 rounded-full">0 items</span>
    </div>
  </header>

  <!-- Product Catalog Container -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="product-list">
    <div class="text-center py-10 text-gray-500">Loading products...</div>
  </main>

  <!-- Checkout Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500">Total</p>
        <p id="total-price" class="text-lg font-extrabold text-green-700">₦0.00</p>
      </div>
      <button onclick="checkout()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-xl transition shadow">
        Order via WhatsApp
      </button>
    </div>
  </div>

  <script>
    // Replace with your exact Render backend base URL
    const BACKEND_URL = 'https://whatsapp-saas-backend-vy2l.onrender.com'
    const STORE_SLUG = 'kicks-fits';

    let vendorData = null;
    let products = [];
    let cart = {};

    async function loadStore() {
      try {
        const res = await fetch(`${BACKEND_URL}/api/vendor/${STORE_SLUG}`);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);

        vendorData = data.vendor;
        products = data.products;

        document.getElementById('store-name').innerText = vendorData.store_name;
        renderProducts();
      } catch (err) {
        document.getElementById('product-list').innerHTML = `<div class="text-red-500 text-center py-8">Failed to load store catalog.</div>`;
      }
    }

    function renderProducts() {
      const list = document.getElementById('product-list');
      list.innerHTML = products.map(p => `
        <div class="bg-white border rounded-2xl p-4 shadow-sm flex items-center gap-4">
          <img src="${p.image_url}" class="w-20 h-20 object-cover rounded-xl bg-gray-100" alt="${p.title}">
          <div class="flex-1">
            <h3 class="font-bold text-gray-900">${p.title}</h3>
            <p class="text-green-700 font-extrabold mt-1">₦${Number(p.price).toLocaleString()}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateCart('${p.id}', -1)" class="w-8 h-8 rounded-lg bg-gray-200 text-gray-700 font-bold">-</button>
            <span id="qty-${p.id}" class="font-semibold text-sm">0</span>
            <button onclick="updateCart('${p.id}', 1)" class="w-8 h-8 rounded-lg bg-green-600 text-white font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function updateCart(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];

      document.getElementById(`qty-${id}`).innerText = cart[id] || 0;
      
      let totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      let totalPrice = Object.entries(cart).reduce((sum, [pId, qty]) => {
        let prod = products.find(p => p.id === pId);
        return sum + (prod ? prod.price * qty : 0);
      }, 0);

      document.getElementById('cart-badge').innerText = `${totalCount} items`;
      document.getElementById('total-price').innerText = `₦${totalPrice.toLocaleString()}`;
    }

    function checkout() {
      const items = Object.entries(cart).map(([pId, qty]) => {
        let prod = products.find(p => p.id === pId);
        return prod ? `• ${prod.title} (x${qty}) - ₦${(prod.price * qty).toLocaleString()}` : '';
      }).filter(Boolean);

      if (items.length === 0) {
        alert('Please add items to your cart first!');
        return;
      }

      let totalPrice = document.getElementById('total-price').innerText;
      let text = `Hello *${vendorData.store_name}*,\n\nI would like to place an order:\n\n${items.join('\n')}\n\n*Total:* ${totalPrice}\n\nPlease confirm availability and payment details!`;

      let whatsappUrl = `https://wa.me/${vendorData.phone_number}?text=${encodeURIComponent(text)}`;
      window.open(whatsappUrl, '_blank');
    }

    loadStore();
  </script>
</body>
</html>
